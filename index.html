<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrintNest</title>
    <meta name="theme-color" content="#1f6feb" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="#/s/demo-xerox" class="brand">PrintNest</a>
      <nav><a href="#/track">Track order</a><a href="#/owner">Shop owners</a></nav>
    </header>
    <main id="app" aria-live="polite">
      <p class="muted">Loading…</p>
    </main>
    <script src="config.js"></script>
    <script type="module" src="src/app.js"></script>
    <script>
      // Lets Android Chrome install PrintNest to the home screen and keeps the page
      // available offline. Not used inside the Android app, which has its own copy.
      if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.Capacitor?.isNativePlatform?.()) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    </script>
  </body>
</html>

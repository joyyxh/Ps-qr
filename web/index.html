<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QRquick — local printing, made simple</title>
    <meta name="theme-color" content="#315be8" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="#/home" class="brand" aria-label="QRquick home"><span class="brand-mark" aria-hidden="true">▦</span> QRquick</a>
      <nav aria-label="Primary navigation">
        <a href="#/scan">Scan shop QR</a><a href="#/track">Track order</a><a href="#/owner">Add your shop</a>
        <label class="theme-picker">Theme
          <select id="theme-select" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
        </label>
      </nav>
    </header>
    <main id="app" aria-live="polite">
      <p class="muted">Loading…</p>
    </main>
    <script src="config.js"></script>
    <script type="module" src="src/app.js"></script>
    <script>
      // Lets Android Chrome install QRquick to the home screen and keeps the page
      // available offline. Not used inside the Android app, which has its own copy.
      if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.Capacitor?.isNativePlatform?.()) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    </script>
  </body>
</html>

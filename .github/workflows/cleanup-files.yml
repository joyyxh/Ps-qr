name: Clean up expired customer files (manual only)

# Scheduled runs were disabled on 2026-11-14 under the cleanup decision (STAGE7_DECISIONS decision 4,
# option R-D: cleanup stays disabled until legal review of C-1 and M1, and an owner-approved retention
# policy exist). The daily schedule that failed 22 of 22 times (2026-10-21 to 2026-11-11) has been removed.
# This is the reversible repository form of the owner-recommended Option B (gh workflow disable).
# To restore the schedule exactly as it was, add back:
#   schedule:
#     - cron: "30 20 * * *"
#
# Manual runs still need two repository secrets: QRQUICK_CLEANUP_URL and CLEANUP_SECRET.
# A run with either secret empty exits before it calls the function. A run with both secrets set
# DELETES expired customer files. Do not run it without the owner's retention approval.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call the cleanup function
        env:
          CLEANUP_URL: ${{ secrets.QRQUICK_CLEANUP_URL }}
          CLEANUP_SECRET: ${{ secrets.CLEANUP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CLEANUP_URL" ] || [ -z "$CLEANUP_SECRET" ]; then
            echo "Set QRQUICK_CLEANUP_URL and CLEANUP_SECRET in the repository secrets."
            exit 1
          fi
          curl -sS --fail-with-body -X POST "$CLEANUP_URL" \
            -H "x-cleanup-secret: $CLEANUP_SECRET" \
            -H "content-type: application/json" \
            -d '{}'

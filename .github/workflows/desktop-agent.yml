name: Desktop print agent

# Builds the QRquick print agent as one executable for Windows x64 and Linux x64 (Node's single
# executable applications), so the shop computer needs no Node.js install. Every run tests the agent,
# builds both executables and runs smoke checks on each. A manual run with "publish" set also creates
# or updates a public prerelease with direct download links, the same way the Android APK is published.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create or update the public prerelease with the executables'
        type: boolean
        default: false
  push:
    branches: [stage7-implementation-2026-11-13]
    paths:
      - 'agent/**'
      - '.github/workflows/desktop-agent.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the agent tests
        working-directory: agent
        run: node --test

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the build tools (kept in agent/dist/work, not in the agent)
        run: |
          set -euo pipefail
          mkdir -p dist/work
          cd dist/work
          npm init -y > /dev/null
          npm install --no-audit --no-fund esbuild@0.24.2 postject@1.0.0-alpha.6

      - name: Build the executable
        run: node standalone/build.mjs dist

      - name: Smoke-test the executable
        run: |
          set -euo pipefail
          EXE="dist/qrquick-print-agent"
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then EXE="dist/qrquick-print-agent.exe"; fi
          test -s "$EXE"
          # The commands must reach the agent: help prints the usage, an unknown command exits 1.
          "$EXE" help | grep -q '^QRquick print agent'
          "$EXE" printers > "$RUNNER_TEMP/printers.txt" 2>&1 || true
          if grep -q 'Unknown command' "$RUNNER_TEMP/printers.txt"; then
            echo 'The printers command was not passed to the agent.' >&2
            cat "$RUNNER_TEMP/printers.txt" >&2
            exit 1
          fi
          set +e
          "$EXE" not-a-command > /dev/null 2>&1
          CODE=$?
          set -e
          test "$CODE" = 1

      - name: Package the executable with the install guide
        run: |
          set -euo pipefail
          NAME="qrquick-print-agent-${{ matrix.platform }}"
          PKG="dist/package/$NAME"
          rm -rf dist/package
          mkdir -p "$PKG" dist/downloads
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            cp dist/qrquick-print-agent.exe "$PKG/"
            cp standalone/PACKAGE-README.txt "$PKG/README.txt"
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/package/$NAME' -DestinationPath 'dist/downloads/$NAME.zip' -Force"
            test -s "dist/downloads/$NAME.zip"
          else
            cp dist/qrquick-print-agent "$PKG/"
            cp standalone/PACKAGE-README.txt "$PKG/README.txt"
            chmod 0755 "$PKG/qrquick-print-agent"
            tar -C dist/package -czf "dist/downloads/$NAME.tar.gz" "$NAME"
            test -s "dist/downloads/$NAME.tar.gz"
          fi

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: agent/dist/downloads/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: downloads
          merge-multiple: true

      - name: Create or update the prerelease
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          TAG="qrquick-desktop-$SHORT"
          ls -l downloads
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "QRquick print agent, one executable per platform, built from commit \`$GITHUB_SHA\`."
            echo
            for FILE in downloads/*; do
              echo "- \`$(basename "$FILE")\`: $(stat -c %s "$FILE") bytes, SHA-256 \`$(sha256sum "$FILE" | cut -d' ' -f1)\`"
            done
            echo
            echo "Built by desktop agent run $GITHUB_RUN_ID: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "No Node.js is needed. Each package has README.txt with the install steps."
            echo "Status: tested with fake printers only. It has not yet been tested on a real printer."
          } > "$NOTES"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" downloads/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" downloads/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "QRquick print agent $SHORT" --notes-file "$NOTES"
          fi
          for FILE in downloads/*; do
            echo "Direct link: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$FILE")"
          done
